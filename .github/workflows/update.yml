name: Auto Update Toffee Cookie
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Fetch Fresh Cookie
        run: |
          python -c "
          import requests
          headers = {
              'User-Agent': 'Mozilla/5.0 (Linux; Android 10; SM-G981B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Mobile Safari/537.36',
              'X-Requested-With': 'com.bti.toffee',
              'Referer': 'https://toffeelive.com/'
          }
          try:
              # সরাসরি টুফি এপিআই টোকেন গেটওয়ে ট্রাই করা
              res = requests.get('https://toffeelive.com/en/watch/t-sports/60000000000000004107', headers=headers, timeout=15, allow_redirects=True)
              cookies = res.cookies.get_dict()
              if 'Edge-Cache-Cookie' in cookies:
                  with open('cookie.txt', 'w') as f:
                      f.write(f'Edge-Cache-Cookie={cookies['Edge-Cache-Cookie']}')
                  print('Success: Cookie Captured')
              else:
                  with open('cookie.txt', 'w') as f:
                      f.write('toffee_locale=en')
                  print('Failed: Still getting locale cookie')
          except Exception as e:
              print(f'Error: {e}')
          "

      - name: Commit and Push
        run: |
          git config --global user.name "nrjtvbd-bot"
          git config --global user.email "nrjtvbd@github.com"
          git add cookie.txt
          git commit -m "Update Cookie via Python Engine" || exit 0
          git push
