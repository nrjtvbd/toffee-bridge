name: Auto Update Toffee Cookie
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4 # এখানে v4 করে দিয়েছি ওয়ার্নিং দূর করতে

      - name: Fetch Cookie from Toffee
        run: |
          # টুফির এপিআই থেকে সরাসরি কুকি টানার চেষ্টা
          COOKIE=$(curl -s -L -I "https://toffeelive.com/en/watch/t-sports/60000000000000004107" \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
          -H "Accept: */*" \
          -H "Connection: keep-alive" \
          | grep -i "set-cookie: Edge-Cache-Cookie=" | cut -d' ' -f2 | cut -d';' -f1 | head -1)
          
          if [ ! -z "$COOKIE" ]; then
            echo "$COOKIE" > cookie.txt
            echo "Bingo! Cookie found: $COOKIE"
          else
            echo "Failed to fetch Edge-Cache-Cookie. Saving default."
            echo "toffee_locale=en" > cookie.txt
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "nrjtvbd-bot"
          git config --global user.email "nrjtvbd@github.com"
          git add cookie.txt
          git commit -m "Updated fresh Toffee cookie" || exit 0
          git push
