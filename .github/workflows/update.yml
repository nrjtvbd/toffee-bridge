name: Auto Update Toffee Cookie
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Fetch Cookie from Toffee
        run: |
          COOKIE=$(curl -s -I "https://toffeelive.com/en/watch/t-sports/60000000000000004107" \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          | grep -oP 'Edge-Cache-Cookie=[^;]+' | head -1)
          
          if [ ! -z "$COOKIE" ]; then
            echo "$COOKIE" > cookie.txt
          else
            echo "Cookie not found"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "nrjtvbd-bot"
          git config --global user.email "nrjtvbd@github.com"
          git add cookie.txt
          git commit -m "Updated fresh Toffee cookie" || exit 0
          git push
