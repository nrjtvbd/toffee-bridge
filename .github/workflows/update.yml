name: Auto Update Toffee Cookie
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5 # v4 থেকে v5 করা হয়েছে
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch Fresh Cookie
        run: |
          python -c "
          import requests
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              'X-Requested-With': 'com.bti.toffee',
              'Referer': 'https://toffeelive.com/'
          }
          try:
              res = requests.get('https://toffeelive.com/en/watch/t-sports/60000000000000004107', headers=headers, timeout=15)
              cookies = res.cookies.get_dict()
              cookie_val = cookies.get('Edge-Cache-Cookie', 'toffee_locale=en')
              
              # কুকি ফরম্যাট ঠিক করা
              final_cookie = f'Edge-Cache-Cookie={cookie_val}' if 'URLPrefix' in cookie_val else cookie_val
              
              with open('cookie.txt', 'w') as f:
                  f.write(final_cookie)
              print(f'Result: {final_cookie[:30]}...')
          except Exception as e:
              print(f'Error: {e}')
              with open('cookie.txt', 'w') as f:
                  f.write('toffee_locale=en')
          "

      - name: Commit and Push
        run: |
          git config --global user.name "nrjtvbd-bot"
          git config --global user.email "nrjtvbd@github.com"
          git add cookie.txt
          git commit -m "Update Cookie via Python Engine" || exit 0
          git push
