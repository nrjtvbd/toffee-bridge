name: Auto Update Toffee Cookie
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# গিটহাবের নোড ২৪ ওয়ার্নিং দূর করার জন্য এই অংশটি যোগ করা হয়েছে
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Fetch Cookie with BDIX Masking
        run: |
          # টুফিকে রিডাইরেক্ট ফলো করতে বাধ্য করা এবং বাংলাদেশি আইপি মাস্কিং
          COOKIE=$(curl -s -L -I "https://toffeelive.com/en/watch/t-sports/60000000000000004107" \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
          -H "X-Forwarded-For: 103.147.128.1" \
          -H "X-Real-IP: 103.147.128.1" \
          -H "Referer: https://toffeelive.com/" \
          | grep -i "Set-Cookie: Edge-Cache-Cookie=" | cut -d' ' -f2 | cut -d';' -f1 | head -1)
          
          if [ ! -z "$COOKIE" ] && [[ "$COOKIE" == *"Edge-Cache-Cookie"* ]]; then
            echo "$COOKIE" > cookie.txt
            echo "Success! Cookie captured."
          else
            # যদি প্রথমবার ব্যর্থ হয় তবে ব্যাকআপ হিসেবে লোকাল কুকি রাখা
            echo "toffee_locale=en" > cookie.txt
            echo "Failed to bypass. Still getting locale cookie."
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "nrjtvbd-bot"
          git config --global user.email "nrjtvbd@github.com"
          git add cookie.txt
          git commit -m "Updated Cookie with Node24 fix" || exit 0
          git push
